services:
  - type: web
    name: project-loop-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build && npm run db:setup
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://postgres:your_password@ep-example-123456.us-east-1.aws.neon.tech/project_loop?sslmode=require
      - key: JWT_SECRET
        value: project-loop-super-secret-jwt-key-2026-secure
      - key: FRONTEND_URL
        value: https://loop-ai-feedback-intelligence.vercel.app
